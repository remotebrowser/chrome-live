receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  batch: {}

exporters:
  otlp_http/primary:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:OTEL_EXPORTER_OTLP_AUTHORIZATION}
  otlp_http/secondary:
    endpoint: ${env:OTEL_EXPORTER_OTLP_SECONDARY_ENDPOINT}
    headers:
      Authorization: ${env:OTEL_EXPORTER_OTLP_SECONDARY_AUTHORIZATION}

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/primary, otlp_http/secondary]
