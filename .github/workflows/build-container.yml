name: Build Container Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The custom-chromium tarball must be in the build context -- Dockerfile
      # hard-fails an amd64 build without it. Pulled over the tailnet from the
      # box that produces it. That box runs Tailscale SSH -- auth is tailnet
      # identity + ACL, not a keypair, so no SSH key secret is needed, just
      # tailnet membership.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Fetch custom-chromium tarball over tailnet
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            ubuntu@100.126.119.1:/home/ubuntu/custom-chromium/dist/custom-chromium-151.0.7922.71-release-linux-x64.tar.zst \
            ./custom-chromium-151.0.7922.71-release-linux-x64.tar.zst

      # Built one platform at a time, not `platforms: linux/amd64,linux/arm64`
      # in one call -- see publish.yml for why (concurrent native + QEMU builds
      # starve each other and intermittently segfault the CloakBrowser step).
      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false

      - name: Build Docker image (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: false