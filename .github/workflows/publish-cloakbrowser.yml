name: Publish CloakBrowser Image

# Runs after the base image workflow finishes, so the variant builds FROM a fresh
# chrome-live:latest. Also runnable manually.
#
#   chrome-live-cloakbrowser = chrome-live:latest + Dockerfile.cloakbrowser
#
# amd64 only — CloakBrowser publishes no arm64 binary.
on:
  workflow_run:
    workflows: ["Publish Container Image"]
    types: [completed]
  workflow_dispatch:
  # TEMPORARY: test the publish from the feature branch before merge. Remove before merging.
  push:
    branches: [feat/cloakbrowser-variant]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  publish-cloakbrowser-image:
    # Skip if the upstream publish failed (workflow_run always fires, even on failure).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CloakBrowser image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cloakbrowser
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cloakbrowser:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cloakbrowser:${{ github.sha }}
