name: Publish Daytona Snapshot

# Runs after the base image workflow finishes.
# Also runnable manually — on manual dispatch the workflow builds and pushes the
# image first (feature branches are not published by publish.yml on push).
on:
  workflow_run:
    workflows: ["Publish Container Image"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DAYTONA_SNAPSHOT: chrome-live-cloakbrowser-pro-daytona

jobs:

  ensure-image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Resolve commit SHA
        id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            CLOAKBROWSER_LICENSE_KEY=${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}

      - name: Verify published image
        if: github.event_name == 'workflow_run'
        run: docker pull --platform linux/amd64 "${{ steps.meta.outputs.image }}"

  publish-daytona:
    needs: ensure-image
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Daytona CLI
        run: |
          sudo curl -fL https://github.com/daytonaio/daytona/releases/latest/download/daytona-linux-amd64 \
            -o /usr/local/bin/daytona
          sudo chmod +x /usr/local/bin/daytona
          daytona version

      - name: Authenticate Daytona CLI
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        # `snapshot push` requires a stored profile; the API-key env alone is not enough.
        run: daytona login --api-key "$DAYTONA_API_KEY"

      - name: Push snapshot to Daytona
        env:
          SHA: ${{ needs.ensure-image.outputs.sha }}
          IMAGE: ${{ needs.ensure-image.outputs.image }}
        run: |
          # The base image is published with both :latest and :<sha> tags. `snapshot
          # push` rejects a source image tagged ':latest', so pull the :<sha> tag and
          # re-tag it locally to a short name (this local tag need not exist on the
          # registry). The image's baked ENTRYPOINT (start-init.sh, which unshare-boots
          # s6 when it is not PID 1) is preserved by push.
          docker pull --platform linux/amd64 "$IMAGE"
          SRC="chrome-live:${SHA:0:12}"
          [ "$SRC" = "chrome-live:" ] && SRC="chrome-live:build"
          docker tag "$IMAGE" "$SRC"
          # Stable snapshot name. `snapshot push` refuses an existing name (no --force)
          # and `snapshot delete` is asynchronous, so delete the old one, then retry
          # ONLY while the name is still occupied. Fail fast on any other error.
          yes | daytona snapshot delete "$DAYTONA_SNAPSHOT" || true
          for i in $(seq 1 30); do
            if out=$(daytona snapshot push "$SRC" --name "$DAYTONA_SNAPSHOT" --cpu 2 --memory 2 --disk 10 2>&1); then
              echo "Published Daytona snapshot: \`${DAYTONA_SNAPSHOT}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$out" | tail -2
            if echo "$out" | grep -qi "already exists"; then
              echo "attempt $i: snapshot still deleting; retrying in 5s..."
              sleep 5
            else
              echo "snapshot push failed with a non-retryable error" >&2
              exit 1
            fi
          done
          echo "failed to push snapshot ${DAYTONA_SNAPSHOT} after retries" >&2
          exit 1

  publish-daytona-lambda:
    needs: ensure-image
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      # Self-hosted Daytona on the tailnet. Setting BOTH DAYTONA_API_URL and DAYTONA_API_KEY
      # makes the CLI use an implicit env profile, so no `daytona login` is needed (login
      # actually conflicts with env auth: "profile with id env not found"). URL is a tailnet
      # address, e.g. http://<tailscale-ip>:3000/api . Stored as secrets so a single
      # `--secret-file .env` works for local `act` too.
      DAYTONA_API_URL: ${{ secrets.DAYTONA_LAMBDA_API_URL }}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_LAMBDA_API_KEY }}

    steps:
      # The runner must be on the tailnet to reach DAYTONA_API_URL. On GitHub-hosted runners,
      # uncomment this. (Omitted when running where the host already has tailnet access.)
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install Daytona CLI
        run: |
          sudo curl -fL https://github.com/daytonaio/daytona/releases/latest/download/daytona-linux-amd64 \
            -o /usr/local/bin/daytona
          sudo chmod +x /usr/local/bin/daytona
          daytona version

      - name: Create snapshot on self-hosted Daytona
        env:
          IMAGE: ${{ needs.ensure-image.outputs.image }}
        run: |
          # The self-hosted instance has no transient registry, so `snapshot push`
          # (local-image upload) 500s. Use `snapshot create --image`: the instance
          # pulls the published base image. Requires the chrome-live ghcr package to
          # be public (or the instance has ghcr creds). The ref must be name:tag
          # (the CLI rejects :latest and rejects @digest), so use the :<sha> tag the
          # base workflow publishes. The image's baked ENTRYPOINT (start-init.sh)
          # carries into the snapshot (sandbox PID 1 runs `daytona <entrypoint>`).
          # Stable name; delete then retry-create while the name is still occupied (async
          # delete), fail fast on any other error.
          yes | daytona snapshot delete "$DAYTONA_SNAPSHOT" || true
          for i in $(seq 1 30); do
            if out=$(daytona snapshot create "$DAYTONA_SNAPSHOT" --image "$IMAGE" --cpu 2 --memory 2 --disk 10 2>&1); then
              echo "Created self-hosted Daytona snapshot: \`${DAYTONA_SNAPSHOT}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$out" | tail -3
            if echo "$out" | grep -qi "already exists"; then
              echo "attempt $i: snapshot still deleting; retrying in 5s..."
              sleep 5
            else
              echo "snapshot create failed with a non-retryable error" >&2
              exit 1
            fi
          done
          echo "failed to create snapshot ${DAYTONA_SNAPSHOT} after retries" >&2
          exit 1
