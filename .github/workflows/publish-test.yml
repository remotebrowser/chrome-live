name: Publish Test Container Image

# Separate workflow (and name) from publish.yml on purpose: publish-daytona.yml
# fires on any "Publish Container Image" run, so reusing that name would
# replace the production Daytona snapshot with a test image. No :latest, no Fly.
on:
  push:
    branches: ['test/**']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  publish-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # test/official-chromium -> test-official-chromium
      - name: Compute tag
        id: tag
        run: echo "name=$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}-${{ github.sha }}

      - name: Summary
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "Published \`${IMAGE}:${{ steps.tag.outputs.name }}\` and \`${IMAGE}:${{ steps.tag.outputs.name }}-${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
