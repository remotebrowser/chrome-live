name: Test Daytona Snapshot (clearcote branch)

# Branch-scoped test lane: builds this branch's image and pushes it to Daytona
# under its own snapshot name, so it never collides with (or deletes) the
# production `chrome-live-daytona` snapshot published from main.
on:
  push:
    branches: [feat/clearcote-browser-variant]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SNAPSHOT_NAME: chrome-live-daytona-clearcote-test

jobs:

  build-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install Daytona CLI
        run: |
          sudo curl -fL https://github.com/daytonaio/daytona/releases/latest/download/daytona-linux-amd64 \
            -o /usr/local/bin/daytona
          sudo chmod +x /usr/local/bin/daytona
          daytona version

      - name: Authenticate Daytona CLI
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        # `snapshot push` requires a stored profile; the API-key env alone is not enough.
        run: daytona login --api-key "$DAYTONA_API_KEY"

      - name: Push snapshot to Daytona
        env:
          SHA: ${{ github.sha }}
        run: |
          # `snapshot push` rejects a source image tagged ':latest', so pull the
          # ':<sha>' tag just pushed and re-tag it locally to a short name (this
          # local tag need not exist on the registry).
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${SHA}"
          docker pull --platform linux/amd64 "$IMAGE"
          SRC="chrome-live:${SHA:0:12}"
          docker tag "$IMAGE" "$SRC"
          # Stable test-snapshot name. `snapshot push` refuses an existing name
          # (no --force) and `snapshot delete` is asynchronous, so delete the old
          # one, then retry ONLY while the name is still occupied.
          yes | daytona snapshot delete "$SNAPSHOT_NAME" || true
          for i in $(seq 1 30); do
            if out=$(daytona snapshot push "$SRC" --name "$SNAPSHOT_NAME" --cpu 2 --memory 2 --disk 10 2>&1); then
              echo "Published Daytona snapshot: \`$SNAPSHOT_NAME\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$out" | tail -2
            if echo "$out" | grep -qi "already exists"; then
              echo "attempt $i: snapshot still deleting; retrying in 5s..."
              sleep 5
            else
              echo "snapshot push failed with a non-retryable error" >&2
              exit 1
            fi
          done
          echo "failed to push snapshot $SNAPSHOT_NAME after retries" >&2
          exit 1
