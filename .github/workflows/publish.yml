name: Publish Container Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The custom-chromium tarball must be in the build context -- Dockerfile
      # hard-fails an amd64 build without it. Pulled over the tailnet from the
      # box that produces it. That box runs Tailscale SSH -- auth is tailnet
      # identity + ACL, not a keypair, so no SSH key secret is needed, just
      # tailnet membership.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Fetch custom-chromium tarball over tailnet
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            ubuntu@100.126.119.1:/home/ubuntu/custom-chromium/dist/custom-chromium-151.0.7922.71-release-linux-x64.tar.zst \
            ./custom-chromium-151.0.7922.71-release-linux-x64.tar.zst

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built one platform at a time, not `platforms: linux/amd64,linux/arm64`
      # in one call. Concurrent native (amd64) + QEMU-emulated (arm64) builds
      # on a standard GitHub-hosted runner starve each other -- observed
      # intermittently segfaulting the (otherwise fine) CloakBrowser install
      # step under the resulting memory/CPU pressure. Sequential avoids it.
      - name: Build and push amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64

      - name: Build and push arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64

      # Combine the two single-arch images into one multi-arch manifest under
      # the tags everything else references. `:latest` for human pulls; `:<sha>`
      # so the Daytona snapshot workflow can reference a specific tag (Daytona's
      # `snapshot create --image` rejects `:latest` and rejects `@digest`, it
      # needs name:tag).
      - name: Combine into multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64

  publish-fly:
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - app: keep-chrome-live
            token_secret: FLY_API_TOKEN_DEMO
          - app: keep-chrome-live-dev
            token_secret: FLY_API_TOKEN_DEV
          - app: keep-chrome-live-ci
            token_secret: FLY_API_TOKEN_CI
    steps:
      - name: Push to Fly registry
        uses: remotebrowser/shared-github-actions/push-fly-image@v1
        with:
          image: ghcr.io/${{ github.repository }}:latest
          pull: true
          app-name: ${{ matrix.target.app }}
          fly-api-token: ${{ secrets[matrix.target.token_secret] }}
