name: Publish Container Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The custom-chromium tarball must be in the build context -- Dockerfile
      # hard-fails an amd64 build without it. Pulled from this repo's own
      # GitHub Release (public asset, no auth needed) rather than fetched
      # live from wherever it's built.
      - name: Fetch custom-chromium tarball
        run: |
          curl -fsSL -o custom-chromium-151.0.7922.71-release-linux-x64.tar.zst \
            https://github.com/remotebrowser/chrome-live/releases/download/custom-chromium-151.0.7922.71/custom-chromium-151.0.7922.71-release-linux-x64.tar.zst
          curl -fsSL -o custom-chromium-151.0.7922.71-release-linux-x64.tar.zst.sha256 \
            https://github.com/remotebrowser/chrome-live/releases/download/custom-chromium-151.0.7922.71/custom-chromium-151.0.7922.71-release-linux-x64.tar.zst.sha256
          echo "$(cat custom-chromium-151.0.7922.71-release-linux-x64.tar.zst.sha256)  custom-chromium-151.0.7922.71-release-linux-x64.tar.zst" | sha256sum -c -

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # `:latest` for human pulls; `:<sha>` so the Daytona snapshot workflow
          # can reference a specific tag (Daytona's `snapshot create --image`
          # rejects `:latest` and rejects `@digest`, it needs name:tag).
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Chrome is installed from the unpinned google-chrome-stable apt package, so
      # its version is only known after the build. Read it from the pushed image.
      - name: Tag immutable version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          CHROME_VERSION=$(docker run --rm --platform linux/amd64 --entrypoint google-chrome-stable \
            "${IMAGE}@${DIGEST}" --version | grep -oE '[0-9]+(\.[0-9]+){3}')
          if [ -z "$CHROME_VERSION" ]; then
            echo "could not read Chrome version from image" >&2
            exit 1
          fi
          TAG="${CHROME_VERSION}-${GITHUB_SHA::7}"
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${TAG} already exists; not overwriting"
            exit 0
          fi
          docker buildx imagetools create -t "${IMAGE}:${TAG}" "${IMAGE}@${DIGEST}"
          echo "Published \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  publish-fly:
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - app: keep-chrome-live
            token_secret: FLY_API_TOKEN_DEMO
          - app: keep-chrome-live-dev
            token_secret: FLY_API_TOKEN_DEV
          - app: keep-chrome-live-ci
            token_secret: FLY_API_TOKEN_CI
    steps:
      - name: Push to Fly registry
        uses: remotebrowser/shared-github-actions/push-fly-image@v1
        with:
          image: ghcr.io/${{ github.repository }}:latest
          pull: true
          app-name: ${{ matrix.target.app }}
          fly-api-token: ${{ secrets[matrix.target.token_secret] }}
