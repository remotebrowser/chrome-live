name: Publish Container Image

on:
  push:
    branches: [main, custom-chromium-docker]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Test-only: this branch also builds arm64, which needs the custom-chromium
      # tarball in the build context (Dockerfile hard-fails an arm64 build without
      # it). Pulled over the tailnet from the box that produces it. That box runs
      # Tailscale SSH -- auth is tailnet identity + ACL, not a keypair, so no SSH
      # key secret is needed, just tailnet membership. Not run on main -- that
      # pipeline stays amd64-only and doesn't need tailnet access.
      - name: Connect to Tailscale
        if: github.ref == 'refs/heads/custom-chromium-docker'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Fetch custom-chromium tarball over tailnet
        if: github.ref == 'refs/heads/custom-chromium-docker'
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            ubuntu@100.126.119.1:/home/ubuntu/custom-chromium/dist/custom-chromium-151.0.7922.71-release-linux-arm64.tar.zst .

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ github.ref == 'refs/heads/custom-chromium-docker' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          # `:latest` for human pulls; `:<sha>` so the Daytona snapshot workflow
          # can reference a specific tag (Daytona's `snapshot create --image`
          # rejects `:latest` and rejects `@digest`, it needs name:tag).
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  publish-fly:
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - app: keep-chrome-live
            token_secret: FLY_API_TOKEN_DEMO
          - app: keep-chrome-live-dev
            token_secret: FLY_API_TOKEN_DEV
          - app: keep-chrome-live-ci
            token_secret: FLY_API_TOKEN_CI
    steps:
      - name: Push to Fly registry
        uses: remotebrowser/shared-github-actions/push-fly-image@v1
        with:
          image: ghcr.io/${{ github.repository }}:latest
          pull: true
          app-name: ${{ matrix.target.app }}
          fly-api-token: ${{ secrets[matrix.target.token_secret] }}
