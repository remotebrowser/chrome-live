User tinyproxy
Group tinyproxy

Port 8119
ConnectPort 443
ConnectPort 80

Listen 127.0.0.1
Allow 127.0.0.1

# Timeout in seconds
Timeout 600

LogLevel Info
LogFile "/home/user/tinyproxy.log"

# Do not add Via header
DisableViaHeader Yes

# Domain denylist generated at startup from /app/denylist.txt.
# This is enforced by Tinyproxy itself, so it still applies when Upstream is set.
Filter "/app/tinyproxy-filter.txt"
FilterURLs No
FilterType fnmatch
FilterCaseSensitive No

# Upstream proxy configuration
# Format: Upstream type username:password@host:port
