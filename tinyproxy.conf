User tinyproxy
Group tinyproxy

Port 8119
ConnectPort 443
ConnectPort 80

Listen 127.0.0.1
Allow 127.0.0.1

# Timeout in seconds
Timeout 600

LogLevel Info
# No LogFile: tinyproxy defaults to stderr (the inherited fd, so this survives
# the setuid drop to the `tinyproxy` user — fopen("/dev/stdout") does not).
# The s6 run script redirects stderr->stdout so the s6-rc producer-for pipe
# captures it.

# Do not add Via header
DisableViaHeader Yes

# Domain blocklist, derived from /app/hosts at image build time (Dockerfile).
Filter "/app/tinyproxy-filter.txt"
FilterURLs No
FilterType fnmatch
FilterCaseSensitive No

# Upstream proxy configuration
# Format: Upstream type username:password@host:port
